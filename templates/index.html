<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Data Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

        <!-- Upload & Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Upload Dataset</h5>
                        <form id="uploadForm" class="d-flex align-items-center">
                            <input type="file" id="csvFile" name="file" accept=".csv" class="form-control me-2"
                                required>
                            <button type="submit" class="btn btn-success text-nowrap">Upload & Refresh</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Filters</h5>
                            <button class="btn btn-sm btn-outline-secondary" onclick="resetFilters()">Reset</button>
                        </div>
                        <div class="row g-3" id="dynamicFiltersContainer">
                            <!-- Filters will be injected here dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- KPI Row -->
        <div class="row mb-4" id="kpiRow">
            <div class="col-md-4">
                <div class="card text-white bg-primary shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title mb-1">Total Records</h6>
                        <h3 id="kpiTotalRows">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title mb-1" id="kpiSumLabel">Sum</h6>
                        <h3 id="kpiSum">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title mb-1" id="kpiAvgLabel">Average</h6>
                        <h3 id="kpiAvg">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4" id="lineChartRow">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4" id="lineChartTitle">Data Overview</h2>
                        <div class="row">
                            <div class="col-md-8 offset-md-2">
                                <canvas id="salesChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4" id="catChartsRow">
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center" id="barChartTitle">Data Analysis</h5>
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4" id="doughnutChartContainer">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center" id="doughnutChartTitle">Distribution</h5>
                        <canvas id="regionChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4" id="scatterChartContainer">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-center" id="scatterChartTitle">Correlation</h5>
                        <canvas id="scatterChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0">Raw Data</h4>
                            <div class="d-flex w-50 justify-content-end">
                                <input type="text" id="tableSearch" class="form-control me-2 w-50"
                                    placeholder="Search data..." onkeyup="handleSearch()">
                                <button class="btn btn-outline-primary text-nowrap" onclick="exportCSV()">Export
                                    CSV</button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped" id="dataTable">
                                <thead>
                                    <tr id="tableHeaderRow">
                                        <!-- Headers will be inserted here -->
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-muted">
        &copy; 2023 Data Dashboard Project
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
